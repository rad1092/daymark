name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      full_native:
        description: Run the full native build and smoke checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    outputs:
      native: ${{ steps.changes.outputs.native }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect native changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_NATIVE: ${{ inputs.full_native }}
        run: |
          if [ "$FULL_NATIVE" = "true" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
            if grep -Eq '^(src-tauri/|scripts/smoke-macos-bundle\.sh$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
              echo "native=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies before builds
        run: npm audit --audit-level=high

      - name: Verify
        run: |
          npm test
          npm run lint
          npm run demo:build
          npm run software:web:build

  native-core:
    needs: verify
    if: needs.verify.outputs.native == 'true'
    timeout-minutes: 45
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native core
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and launch-smoke the default macOS bundle
        if: github.event_name == 'workflow_dispatch' && inputs.full_native
        run: |
          npm exec -- tauri build --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          npm run software:smoke:macos

      - name: Build and launch-smoke the updater-enabled macOS bundle
        if: github.event_name == 'workflow_dispatch' && inputs.full_native
        env:
          DAYMARK_UPDATE_ENDPOINT: https://updates.invalid/daymark/latest.json
          DAYMARK_UPDATER_PUBKEY: ci-smoke-public-key
        run: |
          npm exec -- tauri build --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          npm run software:smoke:macos

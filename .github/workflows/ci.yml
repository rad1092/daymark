name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run lint
          npm run demo:build
          npm run software:web:build
          npm audit --audit-level=high

  native-core:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native core
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and launch-smoke the default macOS bundle
        run: |
          npm exec -- tauri build --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          npm run software:smoke:macos

      - name: Build and launch-smoke the updater-enabled macOS bundle
        env:
          DAYMARK_UPDATE_ENDPOINT: https://updates.invalid/daymark/latest.json
          DAYMARK_UPDATER_PUBKEY: ci-smoke-public-key
        run: |
          npm exec -- tauri build --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          npm run software:smoke:macos
